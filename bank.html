<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaBank Management</title><link rel="stylesheet" href="bank.css"><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script></head>
<body><div class="app-shell">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">N</div><div><strong>NOVA<span>BANK</span></strong><small>Management Suite</small></div></div>
<nav><button data-page="dashboard"><i data-lucide="layout-dashboard"></i>Overview</button><div class="nav-label">Operations</div><button data-page="customers"><i data-lucide="users"></i>Customers</button><button data-page="accounts"><i data-lucide="wallet-cards"></i>Accounts</button><button data-page="deposits"><i data-lucide="circle-arrow-down"></i>Deposits</button><button data-page="withdrawals"><i data-lucide="circle-arrow-up"></i>Withdrawals</button><button data-page="transfers"><i data-lucide="arrow-left-right"></i>Transfers</button><button data-page="loans"><i data-lucide="landmark"></i>Loans</button><div class="nav-label">Services</div><button data-page="fixed_deposits"><i data-lucide="calendar-clock"></i>Fixed Deposits</button><button data-page="recurring_deposits"><i data-lucide="repeat-2"></i>Recurring Deposits</button><button data-page="cheques"><i data-lucide="notebook-tabs"></i>Cheques</button><button data-page="cards"><i data-lucide="credit-card"></i>Cards</button><button data-page="beneficiaries"><i data-lucide="contact-round"></i>Beneficiaries</button><button data-page="kyc"><i data-lucide="badge-check"></i>KYC Reviews</button><div class="nav-label">Administration</div><button data-page="branches"><i data-lucide="building-2"></i>Branches</button><button data-page="employees"><i data-lucide="user-cog"></i>Employees</button><button data-page="users"><i data-lucide="shield-user"></i>User Access</button><button data-page="reports"><i data-lucide="chart-no-axes-combined"></i>Reports</button><button data-page="notifications"><i data-lucide="bell-ring"></i>Notifications</button><button data-page="audit"><i data-lucide="scroll-text"></i>Audit Logs</button></nav><div class="sidebar-user"><div class="avatar">RA</div><div><strong>Riya Ahuja</strong><small>System Administrator</small></div><button aria-label="User menu">•••</button></div></aside>
<div class="main"><header><button id="menuBtn" class="icon-btn" aria-label="Toggle menu"><i data-lucide="panel-left"></i></button><div class="global-search"><i data-lucide="search"></i><input id="globalSearch" placeholder="Search customers, accounts, invoices..."><kbd>⌘ K</kbd></div><div class="top-actions"><button class="icon-btn" id="notificationBtn" aria-label="Notifications"><i data-lucide="bell"></i><span class="alert-dot"></span></button><button class="icon-btn" aria-label="Help" id="helpBtn"><i data-lucide="circle-help"></i></button></div></header><main id="main"></main></div></div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div><script src="bank.js"></script></body></html>
